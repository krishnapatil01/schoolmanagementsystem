<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exams - SchoolMS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>🎓 SchoolMS</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" data-page="dashboard"><i>📊</i> Dashboard</a>
                <a href="exams.html" class="active" data-page="exams"><i>📝</i> Exams</a>
                <a href="exam-schedule.html" data-page="schedule"><i>📅</i> Exam Schedule</a>
                <a href="marks-entry.html" data-page="marks"><i>✏️</i> Marks Entry</a>
                <a href="results.html" data-page="results"><i>📊</i> Results</a>
                <a href="report-card.html" data-page="report-card"><i>🎓</i> Report Card</a>
                <a href="reports.html" data-page="reports"><i>📈</i> Reports</a>
            </nav>
            <div class="sidebar-footer">
                <button onclick="logout()" class="btn-logout"><i>🚪</i> Logout</button>
            </div>
        </aside>
        
        <main class="main-content">
            <header class="top-bar">
                <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
                <h1 class="page-title">Exam Management</h1>
                <div class="user-info">
                    <span id="userName">Admin User</span>
                </div>
            </header>
            
            <div class="content-area">
                <div class="action-bar">
                    <button class="btn btn-primary" onclick="openExamModal()"><i>+</i> Create Exam</button>
                </div>
                
                <div class="filter-bar">
                    <div class="form-group">
                        <label>Search</label>
                        <input type="text" id="filterSearch" placeholder="Search exams...">
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select id="filterStatus">
                            <option value="">All Statuses</option>
                            <option value="DRAFT">Draft</option>
                            <option value="SCHEDULED">Scheduled</option>
                            <option value="ONGOING">Ongoing</option>
                            <option value="COMPLETED">Completed</option>
                            <option value="PUBLISHED">Published</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Type</label>
                        <select id="filterType">
                            <option value="">All Types</option>
                            <option value="UNIT_TEST">Unit Test</option>
                            <option value="MID_TERM">Mid Term</option>
                            <option value="SEMESTER">Semester</option>
                            <option value="FINAL">Final</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Class</label>
                        <select id="filterClass">
                            <option value="">All Classes</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 0 0 auto;">
                        <button class="btn btn-secondary" style="height: 38px; margin-top: auto;" onclick="loadExams()">Filter</button>
                    </div>
                </div>

                <div class="card">
                    <div class="table-responsive">
                        <table id="examsTable">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Type</th>
                                    <th>Class</th>
                                    <th>Term</th>
                                    <th>Dates</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Dynamic Content -->
                            </tbody>
                        </table>
                    </div>
                    <div class="pagination" id="pagination">
                        <!-- Dynamic Pagination -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Create/Edit Exam Modal -->
    <div id="examModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="examModalTitle">Create Exam</h3>
                <button class="modal-close" onclick="closeExamModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="examForm">
                    <input type="hidden" id="examId">
                    <div class="form-group mb-3">
                        <label>Exam Name <span class="text-danger">*</span></label>
                        <input type="text" id="examName" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Exam Type <span class="text-danger">*</span></label>
                            <select id="examType" required>
                                <option value="">Select Type</option>
                                <option value="UNIT_TEST">Unit Test</option>
                                <option value="MID_TERM">Mid Term</option>
                                <option value="SEMESTER">Semester</option>
                                <option value="FINAL">Final</option>
                                <option value="PRACTICAL">Practical</option>
                                <option value="CUSTOM">Custom</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Academic Year <span class="text-danger">*</span></label>
                            <select id="academicYear" required></select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Term</label>
                            <input type="text" id="examTerm">
                        </div>
                        <div class="form-group">
                            <label>Status</label>
                            <select id="examStatus" disabled>
                                <option value="DRAFT">Draft</option>
                                <option value="SCHEDULED">Scheduled</option>
                                <option value="ONGOING">Ongoing</option>
                                <option value="COMPLETED">Completed</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Class <span class="text-danger">*</span></label>
                            <select id="examClass" required onchange="loadSectionsForModal()"></select>
                        </div>
                        <div class="form-group">
                            <label>Section</label>
                            <select id="examSection">
                                <option value="">All Sections</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Start Date</label>
                            <input type="date" id="startDate">
                        </div>
                        <div class="form-group">
                            <label>End Date</label>
                            <input type="date" id="endDate">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="examDescription" rows="3"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeExamModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveExam()">Save Exam</button>
            </div>
        </div>
    </div>

    <!-- View Exam Modal -->
    <div id="viewExamModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">Exam Details</h3>
                <button class="modal-close" onclick="closeViewModal()">&times;</button>
            </div>
            <div class="modal-body">
                <table class="report-table w-full">
                    <tbody id="viewExamDetails">
                        <!-- Dynamic Details -->
                    </tbody>
                </table>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeViewModal()">Close</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>
    
    <!-- Confirm Dialog Container -->
    <div id="confirmDialog" class="modal-overlay"></div>

    <script src="js/app.js"></script>
    <script src="js/exams.js"></script>
</body>
</html>
