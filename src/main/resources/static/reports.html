<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports & Analytics - SchoolMS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>🎓 SchoolMS</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" data-page="dashboard"><i>📊</i> Dashboard</a>
                <a href="exams.html" data-page="exams"><i>📝</i> Exams</a>
                <a href="exam-schedule.html" data-page="schedule"><i>📅</i> Exam Schedule</a>
                <a href="marks-entry.html" data-page="marks"><i>✏️</i> Marks Entry</a>
                <a href="results.html" data-page="results"><i>📊</i> Results</a>
                <a href="report-card.html" data-page="report-card"><i>🎓</i> Report Card</a>
                <a href="reports.html" class="active" data-page="reports"><i>📈</i> Reports</a>
            </nav>
            <div class="sidebar-footer">
                <button onclick="logout()" class="btn-logout"><i>🚪</i> Logout</button>
            </div>
        </aside>
        
        <main class="main-content">
            <header class="top-bar">
                <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
                <h1 class="page-title">Reports & Analytics</h1>
                <div class="user-info">
                    <span id="userName">Admin User</span>
                </div>
            </header>
            
            <div class="content-area">
                <div class="tabs">
                    <div class="tab active" onclick="switchTab('summary')" id="tab-summary">Summary</div>
                    <div class="tab" onclick="switchTab('class-wise')" id="tab-class-wise">Class-wise</div>
                    <div class="tab" onclick="switchTab('subject-wise')" id="tab-subject-wise">Subject-wise</div>
                    <div class="tab" onclick="switchTab('pass-fail')" id="tab-pass-fail">Pass/Fail</div>
                    <div class="tab" onclick="switchTab('toppers')" id="tab-toppers">Toppers List</div>
                    <div class="tab" onclick="switchTab('absent')" id="tab-absent">Absentees</div>
                </div>

                <div class="filter-bar">
                    <div class="form-group">
                        <label>Exam <span class="text-danger">*</span></label>
                        <select id="examSelect" onchange="loadFiltersAndData()">
                            <option value="">-- Select Exam --</option>
                        </select>
                    </div>
                    <div class="form-group class-filter hidden">
                        <label>Class</label>
                        <select id="classSelect" onchange="loadData()">
                            <option value="">All Classes</option>
                        </select>
                    </div>
                    <div class="form-group section-filter hidden">
                        <label>Section</label>
                        <select id="sectionSelect" onchange="loadData()">
                            <option value="">All Sections</option>
                        </select>
                    </div>
                    <div class="form-group subject-filter hidden">
                        <label>Subject</label>
                        <select id="subjectSelect" onchange="loadData()">
                            <option value="">All Subjects</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 0 0 auto;">
                        <button class="btn btn-primary" style="height: 38px; margin-top: auto;" onclick="loadData()">Generate</button>
                    </div>
                    <div class="form-group" style="flex: 0 0 auto;">
                        <button class="btn btn-secondary" style="height: 38px; margin-top: auto;" onclick="printReport()"><i>🖨️</i> Print</button>
                    </div>
                </div>

                <div class="card" id="reportContainer">
                    <div id="reportTitle" class="action-bar mb-3 hidden">
                        <h3 id="currentReportTitle">Report Data</h3>
                    </div>
                    
                    <div class="table-responsive">
                        <table id="reportTable" class="hidden">
                            <thead id="reportTableHead">
                                <!-- Dynamic headers -->
                            </thead>
                            <tbody id="reportTableBody">
                                <!-- Dynamic content -->
                            </tbody>
                        </table>
                    </div>
                    
                    <div id="noDataMessage" class="empty-state">
                        <i>📈</i>
                        <h3>Generate Report</h3>
                        <p>Select an exam and configure filters to view the report.</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>
    
    <script src="js/app.js"></script>
    <script src="js/reports.js"></script>
</body>
</html>
